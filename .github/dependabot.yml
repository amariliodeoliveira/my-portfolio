version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 2

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"

    groups:
      production-dependencies:
        dependency-type: "production"

      development-dependencies:
        dependency-type: "development"

    ignore:
      # --- Lint toolchain: majors are blocked by a real, verified break ---
      # eslint-plugin-react (bundled inside eslint-config-next) still calls the
      # removed context.getFilename() API and crashes `npm run lint` on ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

      # typescript-eslint's peer range caps typescript at "<6.1.0" (even on its
      # canary channel) — TS 7's native/Go compiler isn't supported yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]

      # Tracks the Next.js major line; review together with next itself.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

      # --- Core framework & UI — majors can break behavior/layout ---
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

      - dependency-name: "daisyui"
        update-types: ["version-update:semver-major"]

      # --- Type definitions — must move in lockstep with runtime/framework majors ---
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]

      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "America/Sao_Paulo"

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "chore(ci)"

    groups:
      github-actions:
        patterns:
          - "*"
